name: CD - Build and Deploy Landing to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: estospaces-landing-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      SERVICE_NAME: estospaces-landing
      REGION: asia-south1
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      TARGET_ENV: prod
      LANDING_APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      LANDING_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push
        run: |
          APP_BASE_URL="${LANDING_APP_BASE_URL:-https://app.estospaces.com}"
          IMAGE_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/estospaces/${SERVICE_NAME}"
          docker build \
            --build-arg NEXT_PUBLIC_APP_BASE_URL="$APP_BASE_URL" \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="$LANDING_GA_MEASUREMENT_ID" \
            -t "${IMAGE_BASE}:${GITHUB_SHA}" .
          docker push "${IMAGE_BASE}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/estospaces/${SERVICE_NAME}:${GITHUB_SHA}"
          SERVICE_TARGET="${SERVICE_NAME}-${TARGET_ENV}"
          gcloud run services update "$SERVICE_TARGET" \
            --image="$IMAGE" \
            --region="${REGION}" \
            --project="${PROJECT_ID}"

      - name: Health check
        run: |
          SERVICE_TARGET="${SERVICE_NAME}-${TARGET_ENV}"
          READY_REVISION="$(gcloud run services describe "$SERVICE_TARGET" --region="${REGION}" --project="${PROJECT_ID}" --format='value(status.latestReadyRevisionName)')"
          test -n "$READY_REVISION"
