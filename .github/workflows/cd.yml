name: CD - Build and Deploy Landing to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: estospaces-landing-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      SERVICE_NAME: estospaces-landing
      REGION: asia-south1
      FALLBACK_SERVICE_NAME: estospaces-landing-www
      FALLBACK_REGION: us-central1
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      TARGET_ENV: prod
      LANDING_APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      LANDING_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push
        run: |
          APP_BASE_URL="${LANDING_APP_BASE_URL:-https://app.estospaces.com}"
          IMAGE_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/estospaces/${SERVICE_NAME}"
          docker build \
            --build-arg NEXT_PUBLIC_APP_BASE_URL="$APP_BASE_URL" \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="$LANDING_GA_MEASUREMENT_ID" \
            -t "${IMAGE_BASE}:${GITHUB_SHA}" .
          docker push "${IMAGE_BASE}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/estospaces/${SERVICE_NAME}:${GITHUB_SHA}"
          SERVICE_TARGET="${SERVICE_NAME}-${TARGET_ENV}"
          if DEPLOY_OUTPUT="$(gcloud run services update "$SERVICE_TARGET" \
            --image="$IMAGE" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" 2>&1)"; then
            printf '%s\n' "$DEPLOY_OUTPUT"
            DEPLOY_SERVICE="$SERVICE_TARGET"
            DEPLOY_REGION="$REGION"
          else
            printf '%s\n' "$DEPLOY_OUTPUT"
            QUOTA_ERROR='Project failed to initialize in this region due to quota exceeded.'
            if [[ "$DEPLOY_OUTPUT" != *"$QUOTA_ERROR"* ]]; then
              exit 1
            fi

            echo "::warning::Mumbai Cloud Run initialization is quota-blocked; deploying the checked image to the existing public landing service."
            gcloud run services update "$FALLBACK_SERVICE_NAME" \
              --image="$IMAGE" \
              --region="$FALLBACK_REGION" \
              --project="$PROJECT_ID"
            DEPLOY_SERVICE="$FALLBACK_SERVICE_NAME"
            DEPLOY_REGION="$FALLBACK_REGION"
          fi

          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "DEPLOY_SERVICE=$DEPLOY_SERVICE" >> "$GITHUB_ENV"
          echo "DEPLOY_REGION=$DEPLOY_REGION" >> "$GITHUB_ENV"

      - name: Health check
        run: |
          READY_REVISION="$(gcloud run services describe "$DEPLOY_SERVICE" --region="$DEPLOY_REGION" --project="$PROJECT_ID" --format='value(status.latestReadyRevisionName)')"
          READY_IMAGE="$(gcloud run services describe "$DEPLOY_SERVICE" --region="$DEPLOY_REGION" --project="$PROJECT_ID" --format='value(spec.template.spec.containers[0].image)')"
          test -n "$READY_REVISION"
          test "$READY_IMAGE" = "$DEPLOY_IMAGE"
