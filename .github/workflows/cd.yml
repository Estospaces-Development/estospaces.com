name: CD - Build and Deploy Landing to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: estospaces-landing-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      # Images live in the europe-west2 Artifact Registry repository "estospaces"
      # (the old asia-south1 registry no longer exists).
      REGISTRY_REGION: europe-west2
      IMAGE_NAME: estospaces-landing
      # estospaces.com is served by this Cloud Run service.
      DEPLOY_SERVICE: estospaces-landing-www
      DEPLOY_REGION: us-central1
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      LANDING_APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      LANDING_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker "${REGISTRY_REGION}-docker.pkg.dev" --quiet

      - name: Build and Push
        run: |
          APP_BASE_URL="${LANDING_APP_BASE_URL:-https://app.estospaces.com}"
          IMAGE="${REGISTRY_REGION}-docker.pkg.dev/${PROJECT_ID}/estospaces/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build \
            --build-arg NEXT_PUBLIC_APP_BASE_URL="$APP_BASE_URL" \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="$LANDING_GA_MEASUREMENT_ID" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "$DEPLOY_SERVICE" \
            --image="$DEPLOY_IMAGE" \
            --region="$DEPLOY_REGION" \
            --project="$PROJECT_ID"

      - name: Health check
        run: |
          READY_REVISION="$(gcloud run services describe "$DEPLOY_SERVICE" --region="$DEPLOY_REGION" --project="$PROJECT_ID" --format='value(status.latestReadyRevisionName)')"
          READY_IMAGE="$(gcloud run services describe "$DEPLOY_SERVICE" --region="$DEPLOY_REGION" --project="$PROJECT_ID" --format='value(spec.template.spec.containers[0].image)')"
          SERVICE_URL="$(gcloud run services describe "$DEPLOY_SERVICE" --region="$DEPLOY_REGION" --project="$PROJECT_ID" --format='value(status.url)')"
          echo "Ready revision: ${READY_REVISION:-none}"
          test -n "$READY_REVISION"
          test "$READY_IMAGE" = "$DEPLOY_IMAGE"
          for url in "${SERVICE_URL}/health" "https://estospaces.com/health"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)"
            echo "$url -> HTTP $code"
            test "$code" = "200"
          done
