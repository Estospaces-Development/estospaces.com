name: Landing CI

on:
  push:
    branches: [local, develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_APP_BASE_URL: https://app.estospaces.com

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run site:audit
      - run: npm run build
      - name: Build hardened Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_BASE_URL="${NEXT_PUBLIC_APP_BASE_URL}" \
            --build-arg NEXT_PUBLIC_LANDING_API_BASE_URL="https://landing-api.estospaces.invalid" \
            -t test-estospaces-com:${{ github.sha }} .
